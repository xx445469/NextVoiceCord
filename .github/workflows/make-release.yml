name: Make Release

# Push a tag like `v0.8.0` and everything else happens automatically: checkout the
# tagged commit, verify the tag matches pom.xml (a release whose jar reports a
# different version than its tag is worse than no release), run the full test
# suite, build the shaded jar, and publish a GitHub Release with generated notes.
#
# `workflow_dispatch` is kept only as a manual re-run of that same pipeline against
# an *already-tagged* commit (e.g. the jar upload flaked and the release needs
# redoing) — it does not bump pom.xml or create a tag itself. Version bumps belong
# in a normal commit to pom.xml on main; tagging that commit is what ships it.
#
# Note: `docker-publish.yml` also triggers on `push: tags: v*` and runs
# independently of this workflow (it publishes to GHCR, this publishes to GitHub
# Releases) — see that workflow for details.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release, e.g. v0.8.0. Must already exist and its commit''s pom.xml must already report this version.'
        required: true
        type: string

# Prevent concurrent releases of the same tag
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build_and_release:
    name: Build, Test, and Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # Required to create the GitHub release
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            echo "::error::Tag '$TAG' does not start with 'v' (expected e.g. v0.8.0)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: $TAG"

      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0  # Full history needed for release-notes generation and git commands

      - name: Set up Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Verify tag matches pom.xml version
        id: version
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TAG_VERSION="${TAG#v}"

          # Same extraction the other release-adjacent workflows use (docker-publish.yml,
          # publish-preview-image.yml): the project's <version> is the first one in pom.xml,
          # ahead of any dependency versions.
          POM_VERSION=$(grep -m 1 '<version>' pom.xml | sed 's/.*<version>\([^<]*\)<\/version>.*/\1/' | tr -d ' ')

          echo "Tag version:      $TAG_VERSION"
          echo "pom.xml version:  $POM_VERSION"

          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "::error::Tag '$TAG' (version '$TAG_VERSION') does not match pom.xml version '$POM_VERSION' at this commit. A release whose jar reports a different version than its tag can't be trusted later. Fix pom.xml and re-tag, or delete this tag and re-push it at the right commit."
            exit 1
          fi
          echo "Version check passed: tag and pom.xml agree on $TAG_VERSION"

          # Pre-release detection must match UpdateChecker.isNewer's rule (see
          # src/main/java/com/jagrosh/jmusicbot/update/UpdateChecker.java#splitVersion):
          # strip build metadata (anything after '+'), then any '-' remaining in the
          # version marks it a pre-release. Using a second, independently-invented rule
          # here would risk disagreeing with what the updater treats as a pre-release.
          CORE_AND_PRE="${TAG_VERSION%%+*}"
          if [[ "$CORE_AND_PRE" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE"

      # Runs before the build because it needs no toolchain and fails fast, mirroring
      # build-and-test.yml.
      - name: Validate translation files
        run: python3 scripts/validate-langs.py

      # Same invocation as build-and-test.yml's "Build and Test with Coverage" step, so a
      # release cannot pass while normal CI on this commit would have failed (or vice versa).
      # `verify` also builds the shaded jar (maven-shade-plugin is bound to the `package`
      # phase, which runs before `verify`).
      - name: Build and run full test suite
        run: |
          COMMIT_TIME=$(git log -1 --format=%cI)
          mvn --batch-mode verify -Pcoverage -Dproject.build.outputTimestamp=$COMMIT_TIME

      - name: Rename JAR
        run: mv target/*-All.jar JMusicBot-${{ steps.version.outputs.version }}.jar

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag.outputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: "JMusicBot-${{ steps.version.outputs.version }}.jar"
          body: |
            ### Setup
            https://jmusicbot.com/setup
            https://jmusicbot.com/config

            # Download: [JMusicBot-${{ steps.version.outputs.version }}.jar](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/JMusicBot-${{ steps.version.outputs.version }}.jar)

            ---
