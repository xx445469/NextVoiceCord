name: Feature request
description: Suggest something the bot should be able to do
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        Describe the situation you are in, not the feature you have in mind. A problem
        usually has more than one solution, and the best one is often not the first idea.
      placeholder: When I try to..., I have to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: usage
    attributes:
      label: How would it be used?
      description: The commands someone would run, or where in the interface it would appear.
      placeholder: |
        1.
        2.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which part of the bot?
      options:
        - Discord commands
        - The now-playing controller panel
        - The desktop window
        - The web panel
        - Translations
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried instead
      description: Including a way of doing it that works but is awkward.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the [wiki](https://github.com/xx445469/NextVoiceCord/wiki) to see whether this already exists
          required: true
        - label: I searched [existing requests](https://github.com/xx445469/NextVoiceCord/labels/enhancement)
          required: true
        - label: I understand this is a self-hosted bot maintained by one person, and that a request may be declined
          required: true
