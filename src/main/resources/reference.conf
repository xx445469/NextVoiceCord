# START OF NEXTVOICECORD CONFIG
# 
# Config for the NextVoiceCord                            
# Any line starting with // or # is ignored            
# You MUST set the token and owner
#
# All other items have defaults if you don't set them
#
# Open in Notepad++ / VS Code for best results

meta {
  # Used for config migration / forward compatibility.
  # DO NOT CHANGE THIS VALUE. It is managed automatically by the bot.
  configVersion = 2
}

discord {
  # This sets the token for the bot to log in with
  # This MUST be a bot token (user tokens will not work)
  # Guide: https://github.com/jagrosh/MusicBot/wiki/Getting-a-Bot-Token
  token = "BOT_TOKEN_HERE"

  # This sets the owner of the bot
  # This needs to be the owner's ID (a 17-18 digit number)
  # Guide: https://github.com/jagrosh/MusicBot/wiki/Finding-Your-User-ID
  owner = 0 # OWNER ID
}

playback {
  # Which backend actually plays audio.
  #
  #   lavaplayer   The bot connects to Discord's voice gateway itself and decodes audio
  #                locally. This is what NextVoiceCord has always done, and is the default.
  #
  #   lavalink     Hands the voice connection and decoding to an external Lavalink node
  #                (see the "lavalink" section below for how to point at one). Stage 1:
  #                join a channel, play a track from a URL or search, pause, resume, skip,
  #                stop, and set volume. The queue display, the now-playing controller
  #                panel buttons, and the web/GUI dashboards are not implemented for this
  #                engine yet — commands outside that list reply saying so rather than
  #                showing stale or incorrect Lavaplayer state.
  #
  #   fallback     NOT IMPLEMENTED YET. Reserved for a later stage that runs both engines
  #                and hands playback over mid-session if the node fails. Setting this now
  #                logs a warning at startup and behaves as "lavaplayer".
  #
  # Default is "lavaplayer".
  engine = "lavaplayer"

  # Maximum track length in seconds.
  # 0 (or less) disables the limit.
  maxTrackSeconds = 0

  # Maximum number of YouTube playlist pages to load (100 tracks per page).
  # Example: 10 pages = up to 1000 tracks.
  maxYouTubePlaylistPages = 10

  # Maximum number of tracks to keep in playback history.
  # Used for: 
  # - the previous/rewind functionality.
  # - the history command and its subcommands.
  # 0 disables playback history entirely.
  maxHistorySize = 40

  # Ratio of users that must vote to skip the currently playing song.
  # Some guilds may override this, this is the default.
  skipRatio = 0.55

  youtube {
    # A "proof of origin" token, and the visitor id it was minted for.
    #
    # YouTube increasingly refuses requests that carry neither this nor an OAuth
    # login, with "Sign in to confirm you're not a bot" or by returning formats
    # the bot cannot play. Supplying one is the upstream-documented fix.
    #
    # Both values must come from the SAME browser session — a poToken is bound to
    # its visitorData and is useless paired with another.
    #
    # To obtain them, see:
    #   https://github.com/lavalink-devs/youtube-source#using-a-potoken
    #
    # These expire; if playback starts failing again after weeks, regenerate.
    # Leave both empty to disable. You do not need this AND useOAuth — either is
    # enough on its own.
    poToken = ""
    visitorData = ""

    # Which InnerTube clients to try, in order, and the first match wins.
    #
    # YouTube breaks clients individually rather than all at once, so being able
    # to reorder this without a rebuild is what makes a workaround possible on
    # the day it is needed.
    #
    # Available: MUSIC, WEB, WEBEMBEDDED, ANDROID, ANDROID_VR, ANDROID_MUSIC,
    #            IOS, MWEB, TV, TVHTML5SIMPLY
    #
    # IMPORTANT when useOAuth is true: only TV and TVHTML5SIMPLY can stream while
    # authenticated. Every other client is registered for metadata only, so a list
    # without one of those resolves track titles and then fails to play anything.
    # TV is appended automatically if you leave it out, with a warning.
    #
    # ANDROIDVR leads because it is the only client that can currently load a playlist
    # at all. Every other one fails with "Could not find tracks from playlist" — on the
    # released 1.18.2 as well as on the newest upstream commit, so this is YouTube having
    # changed the playlist response rather than anything about the pinned build.
    #
    # ANDROID is gone: upstream logs "ANDROID is broken with no known fix" on startup.
    #
    # An earlier note here said ANDROID_VR played nothing. That measurement only ever
    # covered single videos, and it no longer holds: measured again on a residential
    # connection, this list plays a YouTube Music playlist, a YouTube Music single, a
    # plain video, a plain playlist and a search result, producing real audio frames in
    # every case rather than merely loading metadata.
    clients = [ "ANDROIDVR", "IOS", "MUSIC", "WEB", "TV" ]

    # If true, uses YouTube OAuth device flow for playback.
    # Helpful for “Sign in to confirm you’re not a bot” / “Video unavailable” issues.
    # When enabled, a code is printed in console/DM'd to the owner for https://www.google.com/device
    # Only needs to be done once (refresh token persists unless changed).
    useOAuth = false
  }

  # Audio sources toggles.
  # If you want to disable a source, set the value to false
  audioSources {
    youtube = true
    spotify = true
    soundcloud = true
    bandcamp = true
    vimeo = true
    twitch = true
    beam = true
    getyarn = true
    nico = true
    http = true
    local = true
  }

  # Transforms can rewrite play inputs into other inputs.
  # Advanced feature, can be used for whitelists/blacklists or custom routing.
  # Not easy to configure, see code for supported fields.
  transforms = {}
}

# Only read when playback.engine = "lavalink". Ignored (and left disconnected) otherwise.
#
# This is a Lavalink SERVER's address and credential — something you run separately and
# connect to — not an HTTP/SOCKS proxy. It has nothing to do with the `proxy` section further
# below, which routes the bot's own outbound web requests. Putting a Lavalink node's address
# into `proxy` does not work: it routes ordinary web traffic at a server that only speaks the
# Lavalink protocol.
lavalink {
  # Lavalink nodes to connect to. Stage 1 only ever uses the first entry in this list -
  # routing across multiple nodes is planned for a later stage, so add exactly one for now.
  #
  # password is a credential: like discord.token or proxy.password, it is never sent to the
  # web panel and never appears in logs. It must match the node's own server.password.
  nodes = [
    {
      name = "main"
      host = "localhost"
      port = 2333
      password = "youshallnotpass"
      # If true, connects over https/wss instead of http/ws.
      secure = false
    }
  ]
}

# Spotify links (track/album/playlist/artist).
#
# IMPORTANT — what this actually does: Spotify's audio is DRM-protected and there is no public
# streaming API for it, so this bot can never play Spotify audio, and does not pretend to. What
# it does instead: reads the track list from a Spotify link using Spotify's Web API (titles and
# artist names only), then searches YouTube for each one and plays whatever it finds there. Every
# track that plays from a Spotify link is a YouTube upload, not the original Spotify recording.
#
# Requires a free Spotify Developer app (https://developer.spotify.com/dashboard) for the
# client ID and secret below — these authenticate the bot to Spotify's catalog, not to any
# Spotify account, and grant no ability to stream audio. Leave either blank to disable Spotify
# link support entirely (playback.audioSources.spotify has no effect until both are set).
#
# These are credentials: keep config.txt private, and never paste them into a support channel.
spotify {
  clientId = ""
  clientSecret = ""
}

commands {
  # This sets the prefix for the bot
  # If you use !!, the play command will be !!play
  # If you do not set this, the prefix can be a mention of the bot (@Botname play)
  prefix = "@mention"

  # If you set this, the bot will also use this prefix in addition to the one above
  # "NONE" disables
  altPrefix = "NONE"

  # Word used to view the help
  help = "help"

  clearChannel {
    # Maximum number of messages to delete per clear operation.
    # 0 (or less) deletes all eligible messages.
    deleteLimit = 50

    # Maximum message age in days for clear operation eligibility.
    # 0 (or less) disables age filtering.
    ageDays = 14
  }

  # Configure custom aliases for commands.
  # Multiple aliases are comma-separated inside the list.
  # Example:
  # play = [ "p" ]
  # search = [ "yts", "find" ]
  aliases {
    # General commands
    settings = [ "status" ]

    # Music commands
    lyrics = []
    nowplaying = [ "np", "current" ]
    play = []
    playlists = [ "pls" ]
    queue = [ "list" ]
    remove = [ "delete" ]
    scsearch = []
    search = [ "ytsearch" ]
    shuffle = []
    skip = [ "voteskip" ]

    # Admin commands
    prefix = [ "setprefix" ]
    setdj = []
    setskip = [ "setskippercent", "skippercent", "setskipratio" ]
    settc = []
    setvc = []

    # DJ commands
    forceremove = [ "forcedelete", "modremove", "moddelete", "modelete" ]
    forceskip = [ "modskip" ]
    movetrack = [ "move" ]
    pause = []
    playnext = []
    queuetype = []
    repeat = []
    skipto = [ "jumpto" ]
    stop = [ "leave" ]
    volume = [ "vol" ]
  }
}

presence {
  # Modifies the default game shown on the bot.
  # Set to "NONE" for no game, "DEFAULT" for default behavior,
  # or set a custom string (Discord chooses the verb/presence style).
  game = "DEFAULT"

  # Default status: ONLINE | IDLE | DND | INVISIBLE
  status = "ONLINE"

  # If true, shows the currently playing song title in presence.
  # Works reliably only if the bot plays music in ONE guild.
  songInStatus = false
}

ui {
  # Default bot language, used by any server that has not chosen its own.
  # Individual servers override this with the language command; that override is
  # stored in serversettings.json and is unaffected by changes here.
  #
  # Available: EN, DE, ES, FR, JA, KO, PL, RU, UA, VN, ZHCN, ZHTW
  # Separators are ignored, so "zh-TW" and "ZHTW" are the same language.
  #
  # Translations other than EN may be incomplete. Any missing text falls back to
  # English per message, so a partly translated language is still usable.
  # Default is "EN".
  language = "EN"

  # Customize emojis shown in bot responses.
  emojis {
    success = "🎶"
    warning = "💡"
    error = "🚫"
    loading = "⌚"
    searching = "🔎"
  }
}

gui {
  # If true, the GUI will be enabled.
  # Default is true.
  enabled = true
  
  # Theme for the GUI window: light, dark, darcula, intellij
  # Default is "dark" for a modern look
  theme = "dark"
  
  # Base font size for GUI components (8-24)
  # Higher values make text larger and more readable
  fontSize = 12
  
  # Language for the desktop window, e.g. "ZHTW", "JA", "DE".
  # This is separate from ui.language, which is what the bot says on Discord.
  # Leave blank to follow ui.language.
  language = ""
}

# Settings for the web panel, which only runs when started with --web <port>.
web {
  # Which network interface the panel listens on.
  #
  #   "127.0.0.1"  only this machine. Nothing else on the network can reach it.
  #   "0.0.0.0"    every interface, so phones and other computers on your network
  #                can reach it. This is what you want for viewing the panel from
  #                another device, and it is also what exposes it to everyone else
  #                on that network.
  #
  # The panel always requires the token printed at startup, but it speaks plain
  # HTTP, so on a shared network that token travels in the clear. Do not forward
  # this port through a router.
  #
  # Default is "127.0.0.1".
  bindAddress = "127.0.0.1"

  # Whether the panel may write to this file.
  #
  # Turning this on lets anyone who has the token change the bot's configuration,
  # including from another machine if bindAddress allows it. Secrets such as the
  # Discord token are never sent to the panel and cannot be read back through it,
  # but they can be overwritten.
  #
  # Default is false.
  allowConfigEdit = false
}

nowPlaying {
  # If true, the nowplaying command will show YouTube thumbnails.
  # Only works if minimalMessage is false
  images = false

  # If true, render now-playing messages in a compact/minimal layout.
  # If false, use the full now-playing layout.
  minimalMessage = false

  # If true, include interactive playback buttons in now-playing messages.
  # If false, render now-playing messages without action rows/buttons.
  showButtons = true

  # If true, show a progress bar in now-playing messages.
  # Also enables the 10-second now-playing refresh thread.
  showProgressBar = false
}

voice {
  # If true, the bot will not leave a voice channel after finishing a queue.
  # Staying connected uses additional bandwidth; not recommended if bandwidth is a concern.
  stayInChannel = false

  # Seconds the bot stays alone in a voice channel before leaving and clearing queue.
  # 0 (or less) disables.
  aloneTimeUntilStopSeconds = 10
}

paths {
  # Folder used for playlists (relative or absolute).
  playlistsFolder = "Playlists"
}

updates {
  # If true, the bot will DM the owner when a new version is available.
  alerts = true

  # If true, the bot downloads new releases and restarts itself into them.
  #
  # Off by default: this replaces the binary of a running process without anyone
  # in the loop, so a bad release takes the bot down unattended. Turn it on only
  # if unattended recovery matters more to you than reviewing what ships.
  #
  # A restart drops every voice connection instantly, so an update is downloaded
  # as soon as it is found but installed only once nothing is playing anywhere.
  # The previous jar is kept alongside with a .backup suffix.
  autoUpdate = false

  # Hours between update checks.
  checkIntervalHours = 6

  # There is deliberately no "repository" or "githubToken" setting here. Updates
  # always come from this project's own repository — letting that be configurable
  # would be a way to point a self-updater at arbitrary code — and the repository
  # is public, so no token is needed to read its releases.
}

logging {
  # Logging verbosity: off, error, warn, info, debug, trace, all
  # Recommended: info
  level = "info"
}

performance {
  # Audio buffer settings to reduce stuttering from GC pauses.
  # Higher values provide more protection but add latency.
  #
  # Both settings below apply to the built-in Lavaplayer engine only. A Lavalink node manages
  # its own buffering, so they have no effect while playback.engine is "lavalink".

  # NAS (Native Audio Send) buffer duration in milliseconds.
  # This buffer protects against JVM pauses up to this duration.
  # Default: 800 (can tolerate GC pauses up to 800ms)
  nasBufferMs = 800
  
  # Lavaplayer frame buffer duration in milliseconds.
  # Amount of decoded audio to keep buffered ahead of playback.
  # Default: 2000 (2 seconds of audio pre-buffered)
  frameBufferMs = 2000
}

proxy {
  # An HTTP/SOCKS proxy for the bot's OWN outbound network requests (audio streams, the
  # Discord API, GitHub update checks). This is not a Lavalink node — if you run Lavalink, its
  # address goes in the `lavalink` section above, not here. The two sections look alike
  # (host/port/username/password) but do unrelated things: this one is a relay for ordinary web
  # traffic; a Lavalink node is a dedicated audio server that speaks its own protocol and will
  # not work as an HTTP proxy.
  #
  # Leave host empty to disable proxy entirely.
  # This setting is EXPERIMENTAL/DEVELOPMENT level, may not work as expected
  # You can also provide proxy host/port using java args
  # -Dhttp.proxyHost=<proxy-hostname>
  # -Dhttp.proxyPort=<proxy-port>
  # -Dhttps.proxyHost=<proxy-hostname>
  # -Dhttps.proxyPort=<proxy-port>
  
  # Proxy server hostname (e.g., "127.0.0.1" or "proxy.example.com")
  host = ""
  
  # Username and password, if the proxy requires authentication.
  # Leave both empty for an open proxy.
  #
  # These are credentials: config.txt is excluded from version control, but if you
  # share the file for troubleshooting, remove them first.
  username = ""
  password = ""

  # Proxy server port (e.g., 8080, 18080)
  port = 0
  
  # Which components should route through the proxy.
  # Practical use case: enable only the audio playback line to proxy audio streams
  # while letting Discord API and other traffic go through normally.

  # Route the built-in audio engine's own outbound requests through the proxy: the actual
  # audio/video streams it fetches (YouTube, SoundCloud, etc.), not the Discord voice
  # connection itself. The underlying engine is named Lavaplayer, but this flag is about what
  # traffic it proxies, not about the engine's name. Has no effect while playback.engine above
  # is "lavalink" — the Lavalink node does its own fetching, on its own network.
  lavaplayer = false
  
  # Route JDA Discord API traffic through proxy
  jda = false
  
  # Route GitHub version check requests through proxy
  github = false
}

dangerous {
  # Enables the eval command for the bot owner (arbitrary code execution).
  #
  # WARNING: Extremely dangerous. Only enable if you 100% understand the risks.
  # If someone asks you to enable this, there is a high chance they are scamming you.
  eval = false
  evalEngine = "Nashorn"
}

# END OF NEXTVOICECORD CONFIG
